name: Vibejudge
options:
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.example.vibejudge
    SWIFT_VERSION: 5.10
targets:
  Vibejudge:
    type: application
    platform: iOS
    sources:
      - Vibejudge
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vibejudge
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Upload a selfie to create a playful vibe read.
        INFOPLIST_KEY_NSCameraUsageDescription: Take a selfie to create a playful vibe read.
    dependencies: []
